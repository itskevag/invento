services:
  backend:
    build:
      context: ./backend
    container_name: invento-backend
    ports:
      - "8000:8000"
    volumes:
      - invento_backend_data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/invento.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: invento-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  info:
    image: alpine:latest
    container_name: invento-info
    depends_on:
      - frontend
      - backend
    command: >
      sh -c "
      echo '';
      echo 'Invento is running:';
      echo 'Frontend:   http://localhost:5173';
      echo 'Backend:    http://localhost:8000';
      echo 'API Docs:   http://localhost:8000/docs';
      echo '';
      "

volumes:
  invento_backend_data: